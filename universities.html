<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universities in Romania</title>
  <link rel="stylesheet" href="universities.css">
  <script src="universities.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">Fetch API lab</p>
      <h1 id="page-title">Universities in Romania</h1>
      <p class="intro">Load live university data, filter by name, and export the visible rows as CSV.</p>
    </section>

    <section class="controls" aria-label="University controls">
      <label for="q">Filter (optional):</label>
      <input id="q" type="search" placeholder="search by name…" autocomplete="off">
      <button id="exportCsv" type="button">Export CSV</button>
    </section>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <section class="table-wrap" aria-label="University results">
      <table>
        <thead>
          <tr>
            <th scope="col">Name</th>
            <th scope="col">Country</th>
            <th scope="col">Website</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </section>
  </main>
</body>
</html>
